[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrstar"
dynamic = ["version"]
description = "QR-STAR: rooting species trees under the multi-species coalescent"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Yasamin Tabatabaee" }
]
dependencies = [
    "DendroPy>=4",
    "numpy",
    "table-five",
    "treeswift",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
qrstar = "qrstar.cli:run"

[project.urls]
Homepage = "https://github.com/ytabatabaee/QR-STAR"
Repository = "https://github.com/ytabatabaee/QR-STAR"

[tool.setuptools.dynamic]
version = { attr = "qrstar.version.__version__" }

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["qrstar*"]

[tool.setuptools.package-data]
qrstar = [
    "rooted_quintet_indices.npy",
    "topologies/*.tre",
]
